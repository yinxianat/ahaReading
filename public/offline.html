<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<title>You're offline · AhaReading</title>
<style>
  :root { --bg:#FAF9F6; --text:#1C1D1F; --muted:#5F6368; --accent:#2557D6; --accent-fg:#fff; --border:#E3E0D9; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121316; --text:#ECEBE8; --muted:#A3A7AD; --accent:#7FA3FF; --accent-fg:#0E1A3A; --border:#33363C; } }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif; }
  main { max-width:440px; margin:0 auto; padding:calc(64px + env(safe-area-inset-top)) 16px 32px; text-align:center; }
  h1 { font-size:24px; line-height:1.2; margin:16px 0 8px; }
  p { color:var(--muted); line-height:1.5; }
  .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
  a, button { min-height:44px; padding:0 16px; border-radius:12px; font:600 16px/44px inherit; text-decoration:none; cursor:pointer; }
  button { background:var(--accent); color:var(--accent-fg); border:0; }
  a { color:var(--text); border:1px solid var(--border); }
</style>
</head>
<body>
<main>
  <p style="font-weight:700;color:var(--text)">AhaReading</p>
  <h1>You're offline.</h1>
  <p>This page hasn't been saved for offline use yet. Your Notebook and Review work offline once you've opened them while connected.</p>
  <div class="row">
    <button type="button" onclick="location.reload()">Try again</button>
    <a href="/review">Go to Review</a>
    <a href="/notebook">Go to Notebook</a>
  </div>
</main>
</body>
</html>
